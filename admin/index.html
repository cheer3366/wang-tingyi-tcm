<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>王婷乙醫師｜文章管理</title>
    <meta name="robots" content="noindex,nofollow" />
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f2f4f6;color:#303740;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;padding:24px}.panel{max-width:640px;background:#fff;border:1px solid #dce1e5;border-radius:24px;padding:48px;box-shadow:0 20px 60px rgba(38,46,56,.09)}.eyebrow{letter-spacing:.18em;text-transform:uppercase;color:#77818d;font-weight:700}h1{font-size:clamp(32px,7vw,52px);margin:14px 0}p{font-size:18px;line-height:1.8;color:#66717d}.button{display:inline-block;margin-top:18px;padding:15px 24px;border-radius:999px;background:#303740;color:#fff;text-decoration:none;font-weight:700}.note{font-size:14px;margin-top:24px}@media(max-width:560px){.panel{padding:30px 24px}}
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="eyebrow">Health Notes Admin</div>
      <h1>衛教文章管理</h1>
      <p>使用網站所屬的 GitHub 帳號登入，即可新增、編輯文章與上傳圖片。儲存後，網站會由 GitHub Pages 自動更新。</p>
      <a class="button" href="https://app.pagescms.org/">使用 GitHub 登入後台</a>
      <p class="note">第一次登入時，請選擇 cheer3366／wang-tingyi-tcm，並允許 Pages CMS 存取這個網站。</p>
    </main>
  </body>
</html>
